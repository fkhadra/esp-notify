[package]
edition      = "2024"
name         = "esp-noti"
rust-version = "1.98"
version      = "0.1.0"
autobins     = false

[[bin]]
name = "esp-noti"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-alloc = "0.10.0"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
critical-section = "1.2.0"
static_cell      = "2.1.1"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "icmp",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"

embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-hal-bus = "0.3.0"
embedded-graphics = "0.8.2"

reqwless = { version = "0.14.0", default-features = false, features = [
  "embedded-tls",
  "alloc",
] }


picoserve = { version = "0.20.0", features = ["embassy", "json"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
mipidsi = "0.10.0"
mousefood = { version = "0.5.2", default-features = false, features = ["fonts"] }
ratatui = { version = "0.30.2", default-features = false }

# embedded-tls 0.18 uses der's heapless-gated `SequenceOf`/`SetOf` without enabling the feature
der = { version = "0.8.2", default-features = false, features = ["heapless"] }
embedded-tls = { version = "0.18", default-features = false, features = ["log"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
